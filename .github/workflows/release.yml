name: release

# Publica no Maven Central ao enviar uma tag de release candidate (v1.0.0-RC1, v1.0.0-RC2...)
# ou de versão final (v1.0.0).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-RC[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: "25"
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Definir versão a partir da tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Publicar
        run: mvn -B -ntp clean deploy -Prelease -Dno-format
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
